networks:
  tms_net:
    name: tms_net

volumes:
  db_data:
  storage_uploads:
  rabbitmq_data:

services:
  # API Gateway stack
  db:
    ulimits:
      stack: 8388608    
      nproc: 40960
    image: postgres:16
    container_name: riim_logistics_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=paragon
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - tms_net
    security_opt:
      - seccomp=unconfined


  rabbitmq:
    ulimits:
      stack: 8388608    
      nproc: 40960
    image: rabbitmq:3.13-management
    container_name: riim_logistics_rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - tms_net
    security_opt:
      - seccomp=unconfined


  # Optimization algorithm (Django)
  opt-algorithm:
    ulimits:
      stack: 8388608    
      nproc: 40960
    build:
      context: ./opt-algorithm
      dockerfile: Dockerfile
    pull_policy: build
    image: custom-opt-algorithm:local
    container_name: riim_logistics_opt_algorithm
    depends_on:
      db:
        condition: service_healthy
      api_gateway:
        condition: service_started
    environment:
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/paragon?schema=public
    restart: always
    ports:
      - "8001:8000"
    networks:
      - tms_net
    security_opt:
      - seccomp=unconfined

  api_gateway:
    ulimits:
      stack: 8388608    
      nproc: 40960
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    pull_policy: build
    image: custom-api-gateway:local
    ports:
      - "28080:8080"
    container_name: riim_logistics_api_gateway
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/paragon?schema=public
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      - DJANGO_URL=http://opt-algorithm:8000
      - SECRET_KEY=${SECRET_KEY}
      - RABBITMQ_EXCHANGE=${RABBITMQ_EXCHANGE}
      - RABBITMQ_ROUTING_KEY=${RABBITMQ_ROUTING_KEY}
      - RABBITMQ_AUDIT_KEY=${RABBITMQ_AUDIT_KEY}
      - RABBITMQ_API_KEY=${RABBITMQ_API_KEY}
      - RUN_INITIAL_DATA=${RUN_INITIAL_DATA}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
    restart: always
    command: sh -c "npx prisma migrate deploy && node index.js"
    networks:
      - tms_net

  # Storage service
  storage_service:
    ulimits:
      stack: 8388608    
      nproc: 40960
    build:
      context: ./storage
      dockerfile: Dockerfile
    pull_policy: build
    ports:
      - "18081:8081"
    image: custom-storage:local
    container_name: riim_logistics_storage_service
    volumes:
      - storage_uploads:/app/uploads
    environment:
      - STORAGE_API_KEY=${STORAGE_API_KEY}
    restart: always
    networks:
      - tms_net

  # Worker
  tmslastmile_worker:
    ulimits:
      stack: 8388608    
      nproc: 40960
    build:
      context: ./tmslastmile-worker
      dockerfile: Dockerfile
    pull_policy: build
    image: custom-tmslastmile-worker:local
    container_name: riim_logistics_worker
    environment:
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      - EXCHANGE=box_exchange
      - ROUTING_KEY=box.job
      - AUDIT_KEY=box.audit
      - QUEUE=${QUEUE}
      - BACKEND_API=http://api_gateway:8080/api/v1/box/dimension-result
      - ML_API_URL=${ML_API_URL}
      - RABBITMQ_API_KEY=${RABBITMQ_API_KEY}
      - STORAGE_API_KEY=${STORAGE_API_KEY}
    depends_on:
      api_gateway:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: always
    networks:
      - tms_net
    security_opt:
      - seccomp=unconfined

  # Web Frontend
  web_frontend:
    ulimits:
      stack: 8388608   
      nproc: 40960
    build:
      context: ./web-frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL}
    pull_policy: build
    image: custom-web-frontend:local
    container_name: riim_logistics_frontend
    ports:
      - "13000:3000"
    environment:
      - REACT_APP_GOOGLE_MAPS_KEY=${REACT_APP_GOOGLE_MAPS_KEY}
      - REACT_APP_BACKEND_URL=${REACT_APP_BACKEND_URL}
      - REACT_APP_AI_URL=${REACT_APP_AI_URL}
    restart: always
    networks:
      - tms_net

  ml_service:
    ulimits:
      stack: 8388608    
      nproc: 40960
    build:
      context: ./machine-learning
      dockerfile: Dockerfile.gpu
    pull_policy: build
    image: custom-ml-service:local
    container_name: riim_logistics_ml_service
    profiles:
      - "ml"
    ports:
      - "15001:5001"
    environment:
      # Retain application-specific environment variables
      STORAGE_API_KEY: ${STORAGE_API_KEY}
      PYTHON_PATH: python
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - tms_net
    security_opt:
      - seccomp=unconfined

  ai-service:
    ulimits:
      stack: 8388608   
      nproc: 40960
    security_opt:
      - seccomp=unconfined
    build: ./ai-service
    container_name: riim_logistics_ai_service
    ports:
      - "8000:8000"
    env_file:
      - ./ai-service/.env
    networks:
      - tms_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
    restart: always